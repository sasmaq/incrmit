name: Release

# Publishes a GitHub Release when a version tag is pushed. Only tag pushes
# matching v* trigger this workflow (not branch pushes).
on:
  push:
    tags:
      - "v*"

# Read-only by default; the two publishing jobs widen this to contents: write
# for themselves, so the validation job never holds a token that can write to
# the repository.
permissions:
  contents: read

# Actions are pinned to a commit SHA rather than a tag: a tag can be moved to
# point at different code, so pinning is what makes a run reproducible and keeps
# a hijacked release from silently entering a job that publishes artifacts. The
# comment after each SHA records the release it corresponds to; bump both
# together.
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Coverage gate
        run: make cover

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned to the same version as the CI workflow and local runs.
          version: v2.12.2

      # Set the proxy and checksum database explicitly rather than inheriting them
      # from the runner: they are what make a pinned module version immutable, so
      # a moved upstream tag fails the build instead of running new code.
      - name: govulncheck
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  release:
    name: Build & Publish
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # Same reasoning as the govulncheck step in the validate job: the pinned
      # version is immutable only while the proxy and checksum database are in
      # play, and this job can write to the repository.
      - name: Install nfpm
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*)
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tag $tag does not match v*; refusing to release" >&2
              exit 1
              ;;
          esac

      - name: Build release artifacts
        run: make release VERSION="${{ steps.version.outputs.version }}"

      - name: Extract CHANGELOG release notes
        run: |
          scripts/changelog-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: false

  release-macos:
    name: Build & Publish macOS packages
    needs: validate
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*)
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tag $tag does not match v*; refusing to release" >&2
              exit 1
              ;;
          esac

      - name: Build macOS packages
        run: make release-macos VERSION="${{ steps.version.outputs.version }}"

      - name: Publish macOS packages to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.pkg
            dist/checksums-macos.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
