name: Release

# Publishes a GitHub Release when a version tag is pushed. Only tag pushes
# matching v* trigger this workflow (not branch pushes).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Coverage gate
        run: make cover

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8

  release:
    name: Build & Publish
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*)
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tag $tag does not match v*; refusing to release" >&2
              exit 1
              ;;
          esac

      - name: Build release artifacts
        run: make release VERSION="${{ steps.version.outputs.version }}"

      - name: Extract CHANGELOG release notes
        run: |
          scripts/changelog-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
