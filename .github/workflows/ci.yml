name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to a commit SHA rather than a tag: a tag can be moved to
# point at different code, so pinning is what makes a run reproducible and keeps
# a hijacked release from silently entering the build. The comment after each SHA
# records the release it corresponds to; bump both together.
jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "The following files need gofmt:"
            echo "$diff"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Coverage gate
        run: make cover

  # Fuzzing runs in its own job, on every push, for a fixed budget per target.
  #
  # Two decisions worth keeping straight. It is a *separate job* because fuzzing
  # is non-deterministic: the same commit can pass one run and fail the next
  # when the engine happens to reach a different input, and that must never be
  # what decides whether Build & Test is green. And it is a *short pass on every
  # push* rather than a long nightly one, because the value here is catching a
  # regression in the invariants while the change that caused it is still in
  # front of the author; the seed corpora (including every input a past run
  # found) already replay on every `go test`, so this job is looking for what is
  # new.
  #
  # A failure writes the offending input to the package's testdata/fuzz/
  # directory, which lives only in the runner's workspace, so it is printed
  # before the job ends: without that the log would say a target failed and the
  # input that proved it would be gone.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Fuzz each target
        run: make fuzz FUZZTIME=30s

      - name: Show any input the fuzzer found
        if: failure()
        run: |
          for f in $(git ls-files --others --exclude-standard -- '*/testdata/fuzz/*'); do
            echo "=== $f ==="
            cat "$f"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned so `golangci-lint run` locally reports exactly what CI does.
          #
          # This version is tied to the go-version above: the released binary
          # embeds go/types from the Go it was built with, and it cannot
          # typecheck the standard library of a newer one. Go 1.27 moving to
          # `stable` broke v2.12.2 (built with 1.26) with a typecheck error
          # inside internal/poll. Bump this whenever a new Go release does the
          # same, and pick a golangci-lint built with that Go or later
          # (`golangci-lint --version` reports it).
          version: v2.13.2

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # Fails the job when a known vulnerability reaches code this module
      # actually calls, in either the standard library or a dependency.
      #
      # A pinned module version cannot change under us the way a git tag can: the
      # proxy serves a version's content immutably and the go command checks it
      # against the checksum database, so a moved upstream tag fails the build
      # instead of running new code. That protection is only as good as these two
      # settings, which are set explicitly rather than inherited from the runner.
      - name: govulncheck
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
