version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        no-os-exec:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: os/exec
              desc: incrmit does not spawn subprocesses; call cli.Main in-process instead

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sasmaq/incrmit
